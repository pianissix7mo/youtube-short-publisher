name: Publish YouTube Short

on:
  push:
    branches:
      - main
    paths:
      - "inbox/*.mp4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-short-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[cleanup-short]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve and validate input files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            mapfile -t candidates < <(git diff --name-only HEAD^ HEAD -- 'inbox/*.mp4' | sort -u)
            videos=()
            for candidate in "${candidates[@]}"; do
              if [ -f "$candidate" ]; then
                videos+=("$candidate")
              fi
            done
          else
            mapfile -t videos < <(find inbox -maxdepth 1 -type f -iname '*.mp4' -print | sort)
          fi

          if [ "${#videos[@]}" -ne 1 ]; then
            echo "Expected exactly one newly added/modified MP4, found ${#videos[@]}"
            printf '%s\n' "${videos[@]:-}"
            exit 1
          fi

          INPUT_VIDEO="${videos[0]}"
          export INPUT_VIDEO
          echo "INPUT_VIDEO=$INPUT_VIDEO" >> "$GITHUB_ENV"
          echo "Using input video: $INPUT_VIDEO"

          test -s "$INPUT_VIDEO"
          test -s "inbox/metadata.json"
          test -s "assets/music/background.mp3"
          python -m json.tool inbox/metadata.json > /dev/null

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          metadata = json.loads(Path("inbox/metadata.json").read_text(encoding="utf-8"))
          title = str(metadata.get("title", "")).strip()
          description = str(metadata.get("description", "")).strip()
          if not title or title.upper() == "REPLACE ME":
              raise RuntimeError("metadata.json title is still a placeholder")
          if not description or description.upper() == "REPLACE ME":
              raise RuntimeError("metadata.json description is still a placeholder")

          path = os.environ["INPUT_VIDEO"]
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error",
              "-select_streams", "v:0",
              "-show_entries", "stream=width,height,codec_name,pix_fmt:format=duration",
              "-of", "json", path,
          ], text=True))

          if not probe.get("streams"):
              raise RuntimeError("No video stream found")

          stream = probe["streams"][0]
          width = int(stream["width"])
          height = int(stream["height"])
          duration = float(probe["format"]["duration"])
          codec = str(stream.get("codec_name", "unknown"))
          pix_fmt = str(stream.get("pix_fmt", "unknown"))

          print(f"Input: {width}x{height}, {duration:.3f}s, {codec}, {pix_fmt}")
          if width >= height:
              raise RuntimeError(f"Input is not portrait: {width}x{height}")
          if duration <= 0 or duration > 180:
              raise RuntimeError(f"Invalid Shorts duration: {duration:.3f}s")
          PY

      - name: Replace input audio with fixed background music without re-encoding video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          INPUT="$INPUT_VIDEO"
          MUSIC="assets/music/background.mp3"
          OUTPUT="output/short_with_music.mp4"

          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$INPUT")
          echo "Discarding all input audio and using only fixed background music."

          ffmpeg -hide_banner -loglevel error -y \
            -i "$INPUT" \
            -stream_loop -1 -i "$MUSIC" \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k \
            -filter:a "volume=0.35" \
            -t "$duration" -movflags +faststart \
            "$OUTPUT"

      - name: Validate final MP4
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("output/short_with_music.mp4")
          if not path.is_file() or path.stat().st_size == 0:
              raise RuntimeError("Final MP4 was not created")

          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", str(path),
          ], text=True))

          videos = [s for s in probe["streams"] if s.get("codec_type") == "video"]
          audios = [s for s in probe["streams"] if s.get("codec_type") == "audio"]
          if len(videos) != 1:
              raise RuntimeError(f"Expected one video stream, got {len(videos)}")
          if len(audios) != 1:
              raise RuntimeError(f"Expected one audio stream, got {len(audios)}")

          v = videos[0]
          a = audios[0]
          duration = float(probe["format"]["duration"])
          print(
              f"Final: {v['width']}x{v['height']}, {duration:.3f}s, "
              f"video={v.get('codec_name')}, audio={a.get('codec_name')}"
          )
          PY

      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PATH: output/short_with_music.mp4
          METADATA_PATH: inbox/metadata.json
        run: python scripts/youtube_upload.py

      - name: Remove uploaded MP4 from inbox
        if: ${{ success() && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- "$INPUT_VIDEO"
          git commit -m "[cleanup-short] Remove uploaded Short"
          git push
