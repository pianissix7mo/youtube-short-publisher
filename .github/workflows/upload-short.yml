name: Publish YouTube Short

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: youtube-short-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current publisher config
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download MP4 from published Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          mkdir -p input

          mapfile -t assets < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq '.[] | select(.name | test("\\.[mM][pP]4$")) | "\(.id)\t\(.name)"'
          )

          if [ "${#assets[@]}" -ne 1 ]; then
            echo "Expected exactly one MP4 asset in the Release, found ${#assets[@]}"
            printf '%s\n' "${assets[@]:-}"
            exit 1
          fi

          IFS=$'\t' read -r ASSET_ID ASSET_NAME <<< "${assets[0]}"
          INPUT_VIDEO="input/release_short.mp4"

          echo "Downloading Release asset: $ASSET_NAME"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            > "$INPUT_VIDEO"

          test -s "$INPUT_VIDEO"
          echo "INPUT_VIDEO=$INPUT_VIDEO" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"

      - name: Validate input and metadata
        shell: bash
        run: |
          set -euo pipefail

          test -s "$INPUT_VIDEO"
          test -s "inbox/metadata.json"
          test -s "assets/music/background.mp3"
          python -m json.tool inbox/metadata.json > /dev/null

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          metadata = json.loads(Path("inbox/metadata.json").read_text(encoding="utf-8"))
          title = str(metadata.get("title", "")).strip()
          description = str(metadata.get("description", "")).strip()
          if not title or title.upper() == "REPLACE ME":
              raise RuntimeError("metadata.json title is still a placeholder")
          if not description or description.upper() == "REPLACE ME":
              raise RuntimeError("metadata.json description is still a placeholder")

          path = os.environ["INPUT_VIDEO"]
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error",
              "-select_streams", "v:0",
              "-show_entries", "stream=width,height,codec_name,pix_fmt:format=duration",
              "-of", "json", path,
          ], text=True))

          if not probe.get("streams"):
              raise RuntimeError("No video stream found")

          stream = probe["streams"][0]
          width = int(stream["width"])
          height = int(stream["height"])
          duration = float(probe["format"]["duration"])
          codec = str(stream.get("codec_name", "unknown"))
          pix_fmt = str(stream.get("pix_fmt", "unknown"))

          print(f"Input: {width}x{height}, {duration:.3f}s, {codec}, {pix_fmt}")
          if width >= height:
              raise RuntimeError(f"Input is not portrait: {width}x{height}")
          if duration <= 0 or duration > 180:
              raise RuntimeError(f"Invalid Shorts duration: {duration:.3f}s")
          PY

      - name: Replace input audio with fixed background music without re-encoding video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          MUSIC="assets/music/background.mp3"
          OUTPUT="output/short_with_music.mp4"
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$INPUT_VIDEO")

          echo "Discarding all input audio and using only fixed background music."
          ffmpeg -hide_banner -loglevel error -y \
            -i "$INPUT_VIDEO" \
            -stream_loop -1 -i "$MUSIC" \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k \
            -filter:a "volume=0.35" \
            -t "$duration" -movflags +faststart \
            "$OUTPUT"

      - name: Validate final MP4
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("output/short_with_music.mp4")
          if not path.is_file() or path.stat().st_size == 0:
              raise RuntimeError("Final MP4 was not created")

          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", str(path),
          ], text=True))

          videos = [s for s in probe["streams"] if s.get("codec_type") == "video"]
          audios = [s for s in probe["streams"] if s.get("codec_type") == "audio"]
          if len(videos) != 1:
              raise RuntimeError(f"Expected one video stream, got {len(videos)}")
          if len(audios) != 1:
              raise RuntimeError(f"Expected one audio stream, got {len(audios)}")

          v = videos[0]
          a = audios[0]
          duration = float(probe["format"]["duration"])
          print(
              f"Final: {v['width']}x{v['height']}, {duration:.3f}s, "
              f"video={v.get('codec_name')}, audio={a.get('codec_name')}"
          )
          PY

      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PATH: output/short_with_music.mp4
          METADATA_PATH: inbox/metadata.json
        run: python scripts/youtube_upload.py

      - name: Delete temporary Release and tag
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "YouTube upload succeeded. Deleting temporary Release and tag: $RELEASE_TAG"
          gh release delete "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag \
            --yes
